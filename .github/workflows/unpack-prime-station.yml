name: Install Prime Station project
on:
  push:
    branches: [main]
    paths:
      - prime-station-render-ready.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project files
        run: |
          test -f prime-station-render-ready.zip
          unzip -o prime-station-render-ready.zip -d .
          rm prime-station-render-ready.zip
      - name: Commit project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Prime Station integration project" || echo "No changes to commit"
          git push
